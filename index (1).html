<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tailor VIP</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000">
<style>
:root{--bk:#000;--cd:#14110a;--cd2:#1d180c;--gd:#d4af37;--gl:#f3d97a;--tx:#f4ecd4;--mu:#a89968;--rd:#e5484d;--gr:#4cc38a}
*{box-sizing:border-box}
body{margin:0;background:var(--bk);color:var(--tx);font:16px/1.45 Georgia,'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Segoe UI',serif;min-height:100vh}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] button,[dir=rtl] select{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Urdu Typesetting','Segoe UI',serif;line-height:1.9}
#app{max-width:900px;margin:auto;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#000;border-bottom:1px solid var(--gd);font-size:20px;color:var(--gl);letter-spacing:.5px}
header span{display:flex;gap:8px}
main{padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:1px solid var(--gd);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 4px;font-size:15px;cursor:pointer}
nav button.on{color:var(--gl);box-shadow:inset 0 3px 0 var(--gd)}
button,.btn{cursor:pointer;font:inherit}
.gb{background:linear-gradient(135deg,#f3d97a,#b8901f);color:#000;border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.g{background:transparent;color:var(--gl);border:1px solid var(--gd);border-radius:10px;padding:8px 14px}
.dg{background:transparent;color:var(--rd);border:1px solid var(--rd);border-radius:10px;padding:8px 14px}
.card{background:var(--cd);border:1px solid #3a2f12;border-radius:14px;padding:12px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px;cursor:pointer}
.row .grow{flex:1;min-width:0}
.av{width:52px;height:52px;border-radius:50%;border:2px solid var(--gd);background:var(--cd2) center/cover;display:flex;align-items:center;justify-content:center;color:var(--gd);font-size:22px;flex:none}
.big{width:96px;height:96px}
input,select,textarea{width:100%;background:#0b0904;color:var(--tx);border:1px solid #4a3c14;border-radius:10px;padding:10px;font:inherit}
input:focus,select:focus{outline:2px solid var(--gd)}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
h3,h4{color:var(--gl);margin:10px 0 4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tag{font-size:13px;padding:2px 10px;border-radius:20px;border:1px solid var(--gd);color:var(--gl);white-space:nowrap}
.tag.d{border-color:var(--rd);color:var(--rd)}.tag.o{border-color:var(--gr);color:var(--gr)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid #2c2410;text-align:start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stats div{background:var(--cd2);border:1px solid var(--gd);border-radius:12px;padding:10px;text-align:center;color:var(--gl)}
.stats small{display:block;color:var(--mu)}
#modal{display:none;position:fixed;inset:0;background:#000d;z-index:20;overflow:auto;padding:12px}
#modal>div{max-width:640px;margin:auto;background:var(--cd);border:1px solid var(--gd);border-radius:16px;padding:16px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gd);color:#000;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:30;pointer-events:none}
.lock{max-width:340px;margin:12vh auto;text-align:center;padding:20px}
.lock h1{color:var(--gl);font-size:30px}.lock input,.lock button{margin:6px 0}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;color:#000;background:#fff;padding:16px}#pr *{color:#000!important;border-color:#999!important}}
header b{background:linear-gradient(90deg,#f3d97a,#b8901f);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.stats div{font-size:20px;font-weight:700;background:linear-gradient(160deg,#1d180c,#0b0904)}
.stats small{font-size:12px;font-weight:400;margin-top:2px}
.card{box-shadow:0 2px 10px #0008}
nav button{font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
:root{--cd:#0b1224;--cd2:#111c38;--mu:#b9b3a0}
body{background:radial-gradient(ellipse at 15% 0,#0f1d3d 0,#000 60%) fixed}
.card{border-color:#5a4a1a;background:linear-gradient(160deg,#0f1830,#080c18)}
.lock{border:1px solid var(--gd);border-radius:20px;background:#0b1224aa}
.tag{border-color:#c0c0c0;color:#e8e8e8}
.bts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px 0}.bt{position:relative;-webkit-tap-highlight-color:transparent;border:1px solid #5a4a1a;border-radius:12px;padding:6px;text-align:center;font-size:12px;cursor:pointer;background:#0b1224}.bt img{width:100%;border-radius:8px}.bt.on{border:2px solid var(--gd);background:#3a2e0a;box-shadow:0 0 12px #d4af37aa}.bt.on::after{content:'✓';position:absolute;top:4px;right:6px;background:var(--gd);color:#000;border-radius:50%;width:22px;height:22px;line-height:22px;font-weight:700}.bt b{color:var(--gl)}
</style></head><body>

const STY={kameez:[['style',['Kameez','Kurta','Long Kurta','Waistcoat Kurta']],['collar',['Normal','Band','Sherwani','Shirt']],['cuff',['Normal','Kalaf (cuff)','Plain']],['shoulder',['Full','Half shoulder']],['front',['Plain','Patti','Embroidery']],['pocket',['Side','Front','Both','None']],['daman',['Round','Straight','Side cut']]],shalwar:[['type',['Normal','Sharara','Pajama','Patiala']],['pocket',['Yes','No']],['bottom',['Plain','Tight','Wide']]],waistcoat:[['neck',['V','U','Round']],['buttons',['5','6','7']],['pocket',['2','4','None']],['back',['Plain','Belt']]]};
let db,lang='en',view='cust',cur=null,q='',tmpPhoto='',fil='all',rng=30;
const t=k=>(L[k]||[k,k])[lang=='ur'?1:0];
const ld=ms=>new Date(ms-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>ld(Date.now());
const rs=n=>'Rs '+Math.round(+n||0).toLocaleString('en-US');
const unit=()=>db.s.unit;
const disp=v=>v===''||v==null?'':(unit()=='cm'?+(v*2.54).toFixed(1):+(+v).toFixed(2));
const inp=v=>v===''||v==null?'':(unit()=='cm'?v/2.54:+v);
const paid=o=>o.pay.reduce((a,p)=>a+ +p.a,0);
const bal=o=>o.total-paid(o);
const dueOf=cid=>db.o.filter(o=>o.cid==cid).reduce((a,o)=>a+bal(o),0);
const cname=id=>(db.c.find(c=>c.id==id)||{}).name||'?';
function toast(m){const e=$('#toast');e.textContent=m;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2400)}
/* storage */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('tailorvip',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){return}};
const kvSet=async(k,v)=>{try{const d=await idb();return await new Promise(r=>{const x=d.transaction('kv','readwrite');x.objectStore('kv').put(v,k);x.oncomplete=()=>r()})}catch(e){toast('Storage error')}};
async function save(){await kvSet('db',db);snap()}
async function snap(force){if(db.s.auto===false&&!force)return;const b=(await kvGet('bk'))||[];if(force||!b.length||Date.now()-b[0].t>216e5){b.unshift({t:Date.now(),d:JSON.stringify({c:db.c,o:db.o,e:db.e,n:db.s.n})});b.length=Math.min(b.length,7);await kvSet('bk',b)}}
/* auth */
const hash=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
function setDir(){document.documentElement.dir=lang=='ur'?'rtl':'ltr';document.documentElement.lang=lang}
function lockScreen(){setDir();const first=!db.s.pw;$('#app').innerHTML=`<div class="lock"><div style="font-size:64px;color:var(--gd)">♛</div><h1 style="letter-spacing:4px;margin:0">VIP TAILOR</h1><small style="color:var(--mu)">Stitching Style, Creating Confidence</small><p>${first?t('setup'):''}</p><input id="pw" type="password" placeholder="${t('pass')}" autofocus>${first?`<input id="pw2" type="password" placeholder="${t('pass2')}">`:''}<button class="gb" id="go" style="width:100%" onclick="${first?'doSetup()':'doLogin()'}">${first?t('save'):t('login')}</button>${!first&&db.s.cred?`<button class="g" style="width:100%" onclick="fpLogin()">🖐 ${t('fp')}</button>`:''}<button class="g" onclick="toggleLang(1)">${lang=='ur'?'English':'اردو'}</button></div>`}
async function doSetup(){const p=$('#pw').value;if(p.length<4||p!=$('#pw2').value)return toast(t('badpw'));db.s.salt=b64(rnd(12));db.s.pw=await hash(p,db.s.salt);await save();unlock()}
async function doLogin(){if(await hash($('#pw').value,db.s.salt)==db.s.pw)unlock();else toast(t('wrong'))}
async function enrollFP(){try{const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Tailor VIP'},user:{id:rnd(16),name:'owner',displayName:'Owner'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});db.s.cred=b64(c.rawId);await save();toast(t('ok'))}catch(e){toast(t('fpfail'))}}
async function fpLogin(){try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(db.s.cred)}],userVerification:'required',timeout:60000}});unlock()}catch(e){toast(t('fpfail'))}}
function unlock(){view='cust';render();snap()}
function lock(){lockScreen()}
/* nav */
const go=(v,id)=>{view=v;if(id!=null)cur=id;render();scrollTo(0,0)};
function toggleLang(l){lang=lang=='ur'?'en':'ur';db.s.lang=lang;save();l?lockScreen():render()}
const ico={cust:'👤',ord:'🧵',rep:'📊',set:'⚙'};
function render(){setDir();$('#app').innerHTML=`<header><b>♛ ${esc(db.s.shop)}</b><span><button class="g" onclick="toggleLang()">${lang=='ur'?'EN':'اردو'}</button><button class="g" onclick="lock()">🔒</button></span></header><main>${bk()}${V[view]()}</main><nav>${['cust','ord','rep','set'].map(v=>`<button class="${view==v||(view=='cd'&&v=='cust')||(view=='od'&&v=='ord')?'on':''}" onclick="go('${v}')"><span>${ico[v]}</span>${t(v)}</button>`).join('')}</nav>`}
/* customers */
function custList(){const s=q.toLowerCase();const l=db.c.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(s));return l.length?l.map(c=>{const d=dueOf(c.id);return `<div class="card row" onclick="go('cd',${c.id})"><div class="av" style="${c.photo?`background-image:url(${c.photo})`:''}">${c.photo?'':'♛'}</div><div class="grow"><b>${esc(c.name)}</b><br><small>${esc(c.phone)}</small></div>${d>0?`<span class="tag d">${rs(d)}</span>`:''}</div>`}).join(''):`<p style="color:var(--mu)">${t('none')}</p>`}
const V={rep:()=>{const rows=repRows(),T0=today(),m=repData(),mo=T0.slice(0,7),items={kameez:0,shalwar:0,waistcoat:0};db.o.forEach(o=>o.items.forEach(i=>{if(i.k in items)items[i.k]+=i.q}));const tot=rows.reduce((a,r)=>({n:a.n+r.n,s:a.s+r.s,r:a.r+r.r,e:a.e+r.e}),{n:0,s:0,r:0,e:0});const ms=Object.keys(m).filter(k=>k.startsWith(mo)).reduce((a,k)=>a+m[k].s,0);return `<div class="stats"><div>${rs(m[T0]?.s)}<small>${t('today')}</small></div><div>${rs(ms)}<small>${t('month')}</small></div><div>${rs(db.o.reduce((a,o)=>a+paid(o),0))}<small>${t('recv')}</small></div><div>${rs(db.o.reduce((a,o)=>a+bal(o),0))}<small>${t('due2')}</small></div></div><div class="bar">${[[7,'d7'],[30,'d30'],[0,'dall']].map(([v,k])=>`<button class="${rng==v?'gb':'g'}" onclick="rng=${v};render()">${t(k)}</button>`).join('')}</div><div class="card"><h4>${t('dsales')}</h4>${rows.length?chart(rows):`<p style="color:var(--mu)">${t('none')}</p>`}<small>■ <span style="color:var(--gl)">${t('sales')}</span> &nbsp; <span style="color:var(--gr)">━ ${t('recv')}</span></small></div><div class="card"><h4>${t('exp')}</h4><div class="bar"><input id="xa" type="number" inputmode="numeric" placeholder="${t('amount')}" style="flex:1"><input id="xn" placeholder="${t('expn')}" style="flex:2"><button class="gb" onclick="addExp()">＋</button></div>${db.e.slice(-8).reverse().map(x=>`<div class="bar" style="margin:4px 0;align-items:center"><span style="flex:1">${x.d} · ${esc(x.n)}</span><b>${rs(x.a)}</b><button class="dg" onclick="delExp(${x.id})">✕</button></div>`).join('')}</div><div class="card"><h4>${t('items')}</h4><div class="grid">${Object.keys(items).map(g=>`<div>${t(g)}<br><b style="color:var(--gl)">${items[g]}</b></div>`).join('')}<div>${t('custs')}<br><b style="color:var(--gl)">${db.c.length}</b></div></div></div><div class="card"><table><tr><th>${t('day')}</th><th>${t('orders')}</th><th>${t('sales')}</th><th>${t('recv')}</th><th>${t('exp')}</th></tr>${rows.slice().reverse().filter(r=>r.n||r.s||r.r||r.e).map(r=>`<tr><td>${r.k}</td><td>${r.n}</td><td>${rs(r.s)}</td><td>${rs(r.r)}</td><td>${rs(r.e)}</td></tr>`).join('')}<tr><td><b>${t('total')}</b></td><td><b>${tot.n}</b></td><td><b>${rs(tot.s)}</b></td><td><b>${rs(tot.r)}</b></td><td><b>${rs(tot.e)}</b></td></tr></table><p><b>${t('profit')}: <span style="color:var(--gl)">${rs(tot.r-tot.e)}</span></b></p></div><button class="g" onclick="printRep()">🖨 ${t('prt')}</button>`},
cust:()=>`<div class="bar"><input style="flex:1" placeholder="${t('search')}" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=custList()"><button class="gb" onclick="custForm()">＋ ${t('add')}</button></div><div id="list">${custList()}</div>`,
cd:()=>{const c=db.c.find(x=>x.id==cur);if(!c)return V.cust();const os=db.o.filter(o=>o.cid==c.id).sort((a,b)=>b.id-a.id);return `<button class="g" onclick="go('cust')">‹ ${t('back')}</button><div class="card row" style="margin-top:10px;cursor:default"><div class="av big" style="${c.photo?`background-image:url(${c.photo})`:''}">${c.photo?'':'♛'}</div><div class="grow"><h3 style="margin:0">${esc(c.name)}</h3>${esc(c.phone)}<br><small>${esc(c.note)}</small></div></div><div class="bar"><button class="gb" onclick="ordForm(${c.id})">＋ ${t('newOrd')}</button><button class="g" onclick="custForm(${c.id})">${t('edit')}</button><button class="g" onclick="printCard(${c.id})">🖨 ${t('card')}</button><button class="dg" onclick="delCust(${c.id})">${t('del')}</button></div>${measHTML(c)}<h3>${t('hist')}</h3>${os.map(histRow).join('')||`<p style="color:var(--mu)">${t('none')}</p>`}`},
ord:()=>{const open=db.o.filter(o=>o.status!='delivered'||bal(o)>0);const dueAll=db.o.reduce((a,o)=>a+bal(o),0);const l=db.o.filter(o=>fil=='all'||(fil=='dues'?bal(o)>0:o.status==fil)).sort((a,b)=>b.id-a.id);return `<div class="stats"><div>${db.o.filter(o=>o.status!='delivered').length}<small>${t('open')}</small></div><div>${rs(dueAll)}<small>${t('due2')}</small></div></div><div class="bar"><select style="flex:1" onchange="fil=this.value;render()">${['all','dues',...ST].map(s=>`<option value="${s}" ${fil==s?'selected':''}>${t(s)}</option>`).join('')}</select><button class="gb" onclick="ordForm()">＋ ${t('newOrd')}</button></div>${fil=='dues'?duesList():l.map(ordRow).join('')||`<p style="color:var(--mu)">${t('none')}</p>`}`},
od:()=>{const o=db.o.find(x=>x.id==cur);if(!o)return V.ord();const b=bal(o);return `<button class="g" onclick="go('${o.back||'ord'}')">‹ ${t('back')}</button><div class="card" style="margin-top:10px"><h3 style="margin:0">${t('bill')} #${o.no} · ${esc(cname(o.cid))}</h3><small>${o.date}</small><table>${o.items.map(i=>`<tr><td>${iname(i)}</td><td>${i.q} × ${rs(i.p)}</td><td>${rs(i.q*i.p)}</td></tr>`).join('')}</table>${stHTML(o)}<p><b>${t('total')}: ${rs(o.total)}</b> · ${t('paid')}: ${rs(paid(o))} · <span class="tag ${b>0?'d':'o'}">${t('bal')}: ${rs(b)}</span></p><label>${t('status')}<select onchange="setStatus(${o.id},this.value)">${ST.map(s=>`<option value="${s}" ${o.status==s?'selected':''}>${t(s)}</option>`).join('')}</select></label>${o.note?`<p><small>${esc(o.note)}</small></p>`:''}</div><div class="card"><h4>${t('pay')}</h4><table>${o.pay.map(p=>`<tr><td>${p.d}</td><td>${rs(p.a)}</td></tr>`).join('')}</table><div class="bar"><input id="pa" type="number" inputmode="numeric" style="flex:1" placeholder="${t('amount')}" value="${b>0?b:''}"><button class="gb" onclick="addPay(${o.id})">${t('addPay')}</button></div></div><div class="bar"><button class="gb" onclick="printBill(${o.id})">🖨 ${t('print')}</button><button class="g" onclick="wa(${o.cid},'ready',${o.id})">💬 ${t('wamsg')}</button><button class="dg" onclick="delOrd(${o.id})">${t('del')}</button></div>`},
set:()=>`<div class="card"><label>${t('shop')}<input value="${esc(db.s.shop)}" onchange="db.s.shop=this.value;save();render()"></label><label>${t('unit')}<select onchange="db.s.unit=this.value;save()"><option value="in" ${unit()=='in'?'selected':''}>${t('inch')}</option><option value="cm" ${unit()=='cm'?'selected':''}>${t('cm')}</option></select></label><label>${t('lang')}<select onchange="lang=this.value;db.s.lang=lang;save();render()"><option value="en" ${lang=='en'?'selected':''}>English</option><option value="ur" ${lang=='ur'?'selected':''}>اردو</option></select></label></div><div class="card"><h4>${t('rates')}</h4><div class="grid">${Object.keys(M).map(g=>`<label>${t(g)}<input type="number" inputmode="numeric" value="${(db.s.rates||{})[g]||''}" onchange="setRate('${g}',this.value)"></label>`).join('')}</div></div><div class="card"><div class="bar"><button class="g" onclick="chPw()">🔑 ${t('chpw')}</button><button class="g" onclick="enrollFP()">🖐 ${t('enFp')}</button></div></div><div class="card"><label style="display:flex;gap:10px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" ${db.s.auto?'checked':''} onchange="db.s.auto=this.checked;save()"> ${t('auto')}</label><div class="bar"><button class="gb" onclick="backupNow()">💾 ${t('backup')}</button><button class="g" onclick="$('#rf').click()">📂 ${t('restore')}</button><input id="rf" type="file" accept=".json" hidden onchange="restoreFile(this)"></div><h4>${t('snaps')}</h4><div id="snaps"></div></div>`};
function measHTML(c){return Object.keys(M).map(g=>{const m=(c.m||{})[g]||{};const f=M[g].filter(k=>m[k]!==''&&m[k]!=null);return f.length?`<div class="card"><h4>${t(g)} <small>(${t(unit()=='cm'?'cm':'inch')})</small></h4><div class="grid">${f.map(k=>`<div>${t(k)}<br><b style="color:var(--gl)">${disp(m[k])}</b></div>`).join('')}</div></div>`:''}).join('')}
function ordRow(o){const b=bal(o);return `<div class="card row" onclick="o_back='${view}';openOrd(${o.id})"><div class="grow"><b>#${o.no} ${esc(cname(o.cid))}</b><br><small>${o.date} · ${rs(o.total)} · ${t(o.status)}</small></div><span class="tag ${b>0?'d':'o'}">${rs(b)}</span></div>`}
function histRow(o){const b=bal(o);return `<div class="card" onclick="openOrd(${o.id})" style="cursor:pointer"><div class="row"><div class="grow"><b>#${o.no} · ${o.date}</b><br>${o.items.map(i=>`${i.q} ${iname(i)}`).join(' + ')}</div><span class="tag ${b>0?'d':'o'}">${t(o.status)}</span></div><table><tr><td>${t('total')}</td><td>${rs(o.total)}</td></tr>${o.pay.map(p=>`<tr><td>${t('paid')} · ${p.d}</td><td>${rs(p.a)}</td></tr>`).join('')}<tr><td><b>${t('bal')}</b></td><td><b>${rs(b)}</b></td></tr></table><button class="g" style="margin-top:8px" onclick="event.stopPropagation();ordForm(${o.cid},${o.id})">↻ ${t('again')}</button></div>`}
function repData(){const m={};const g=k=>m[k]=m[k]||{n:0,s:0,r:0,e:0};db.o.forEach(o=>{const x=g(o.date);x.n++;x.s+=o.total;o.pay.forEach(p=>{g(p.d).r+=+p.a})});(db.e||[]).forEach(x=>{g(x.d).e+=+x.a});return m}
function repRows(){const m=repData();let rows=[];if(rng>0){for(let i=rng-1;i>=0;i--){const k=ld(Date.now()-i*864e5);rows.push({k,...(m[k]||{n:0,s:0,r:0,e:0})})}}else{const mm={};Object.keys(m).forEach(k=>{const x=mm[k.slice(0,7)]=mm[k.slice(0,7)]||{n:0,s:0,r:0,e:0};x.n+=m[k].n;x.s+=m[k].s;x.r+=m[k].r;x.e+=m[k].e});rows=Object.keys(mm).sort().map(k=>({k,...mm[k]}))}return rows}
function chart(rows){const W=360,H=190,pl=6,pb=22,pt=14,n=rows.length,mx=Math.max(1,...rows.map(r=>Math.max(r.s,r.r))),bw=(W-pl*2)/n,y=v=>H-pb-(v/mx)*(H-pb-pt);let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;direction:ltr"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d97a"/><stop offset="1" stop-color="#8a6a10"/></linearGradient></defs>`;[0,.5,1].forEach(f=>{const yy=y(mx*f);g+=`<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="#2c2410"/>`});g+=`<text x="${pl}" y="${pt-3}" fill="#a89968" font-size="9">${rs(mx)}</text>`;rows.forEach((r,i)=>{g+=`<rect x="${pl+i*bw+bw*.15}" y="${y(r.s)}" width="${bw*.7}" height="${H-pb-y(r.s)}" rx="2" fill="url(#gg)"/>`});g+=`<polyline points="${rows.map((r,i)=>`${pl+i*bw+bw/2},${y(r.r)}`).join(' ')}" fill="none" stroke="#4cc38a" stroke-width="1.6"/>`;[0,Math.floor((n-1)/2),n-1].forEach(i=>{const k=rows[i].k;g+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" fill="#a89968" font-size="9" text-anchor="${i==0?'start':i==n-1?'end':'middle'}">${k.length>7?k.slice(5):k}</text>`});return g+'</svg>'}
function printRep(){const rows=repRows().filter(r=>r.n||r.s||r.r);printHTML(`<div dir="${lang=='ur'?'rtl':'ltr'}"><h2>♛ ${esc(db.s.shop)}</h2><h3>${t('rep')} · ${today()}</h3><table><tr><th>${t('day')}</th><th>${t('orders')}</th><th>${t('sales')}</th><th>${t('recv')}</th></tr>${rows.map(r=>`<tr><td>${r.k}</td><td>${r.n}</td><td>${rs(r.s)}</td><td>${rs(r.r)}</td></tr>`).join('')}</table></div>`)}
function setRate(g,v){(db.s.rates=db.s.rates||{})[g]=+v||0;save()}
async function addExp(){const a=+$('#xa').value;if(!(a>0))return;db.e.push({id:Date.now(),d:today(),a,n:$('#xn').value});await save();render()}
async function delExp(id){db.e=db.e.filter(x=>x.id!=id);await save();render()}
function duesList(){const m={};db.o.forEach(o=>{const b=bal(o);if(b>0)m[o.cid]=(m[o.cid]||0)+b});const l=Object.keys(m).sort((a,b)=>m[b]-m[a]);return l.map(id=>{const c=db.c.find(x=>x.id==id)||{};return `<div class="card row"><div class="grow" onclick="go('cd',${id})"><b>${esc(c.name)}</b><br><small>${esc(c.phone)}</small></div><span class="tag d">${rs(m[id])}</span><button class="g" onclick="wa(${id},'due')">💬</button></div>`}).join('')||`<p style="color:var(--mu)">${t('none')}</p>`}
function wa(cid,kind,oid){const c=db.c.find(x=>x.id==cid)||{},ur=lang=='ur',o=oid?db.o.find(x=>x.id==oid):null,sh=db.s.shop;let n=(c.phone||'').replace(/\D/g,'');if(n.startsWith('0'))n='92'+n.slice(1);if(!n)return toast(t('phone'));const d=dueOf(cid);const m=kind=='ready'?(ur?`السلام علیکم ${c.name}، آپ کا آرڈر #${o.no} تیار ہے۔ باقی رقم: ${rs(bal(o))}۔ شکریہ — ${sh}`:`Assalam o Alaikum ${c.name}, your order #${o.no} is ready at ${sh}. Balance: ${rs(bal(o))}. Thank you.`):(ur?`السلام علیکم ${c.name}، ${sh} میں آپ کی باقی رقم ${rs(d)} ہے۔ مہربانی کر کے ادا کر دیں۔ شکریہ`:`Assalam o Alaikum ${c.name}, your balance at ${sh} is ${rs(d)}. Please pay when convenient. Thank you.`);window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')}
const btP=()=>{const b=BT.find(b=>b.id==$('#o_b').value);return b?b.p*(+$('#o_bq').value||0):0};
function chkSave(){const b=$('#sv');if(!b)return;const ok=$('#f_n').value.trim()&&$('#f_p').value.trim()&&['kameez','shalwar','waistcoat'].some(g=>M[g].every(f=>$('#m_'+g+'_'+f).value!==''));b.disabled=!ok;b.style.opacity=ok?1:.4}
function stHTML(o){const s=o.st||{};const l=Object.keys(s).map(g=>`<div><b>${t(g)}</b>: ${Object.entries(s[g]).map(([k,v])=>k+' '+v).join(', ')}</div>`).join('');return l?`<div style="margin:6px 0;font-size:14px">${l}</div>`:''}
function showC(id){const c=db.c.find(x=>x.id==id);$('#lk').innerHTML=c?`<div class="card"><b>${esc(c.name)}</b> · ${esc(c.phone)}</div>${measHTML(c)}${db.o.filter(o=>o.cid==c.id).sort((a,b)=>b.id-a.id).slice(0,5).map(o=>`<small>#${o.no} · ${o.date} · ${o.items.map(i=>i.q+' '+iname(i)).join(' + ')} · ${rs(o.total)}</small><br>`).join('')}`:''}
function lookup(){const n=$('#o_nm').value.trim().toLowerCase(),p=$('#o_ph').value.replace(/\D/g,'');const c=n&&p?db.c.find(x=>x.name.trim().toLowerCase()==n&&(x.phone||'').replace(/\D/g,'')==p):null;if(c){$('#o_c').value=c.id;showC(c.id)}else $('#lk').innerHTML=n&&p?`<small style="color:var(--mu)">${t('newc')}</small>`:''}
function pickB(id){const h=$('#o_b'),on=h.value==id;h.value=on?'':id;document.querySelectorAll('.bt').forEach(e=>e.classList.remove('on'));if(!on)$('#bt'+id).classList.add('on');const bb=BT.find(x=>x.id==id);$('#bsel').textContent=on?'':'✓ '+bb.n+' ('+bb.c+') · Rs '+bb.p;calcT()}
function ask(msg,fn){modal(`<h3>${msg}</h3><div class="bar"><button class="gb" id="yes">OK</button><button class="g" onclick="closeM()">${t('cancel')}</button></div>`);$('#yes').onclick=()=>{closeM();fn()}}
function bk(){const d=db.s.lastBk,days=d?Math.floor((Date.now()-new Date(d))/864e5):99;return db.c.length&&days>=7?`<div class="card" style="border-color:var(--rd)">⚠ ${t('bkold')} <button class="gb" style="margin-top:8px" onclick="backupNow()">💾 ${t('backup')}</button></div>`:''}
let o_back='ord';
function openOrd(id){const o=db.o.find(x=>x.id==id);o.back=view=='cd'?'cd':'ord';cur=id;view='od';render();scrollTo(0,0)}
/* modal */
const modal=h=>{$('#modal').innerHTML=`<div>${h}</div>`;$('#modal').style.display='block'};
const closeM=()=>{$('#modal').style.display='none';$('#modal').innerHTML=''};
function custForm(id){const c=id?db.c.find(x=>x.id==id):{m:{}};tmpPhoto=c.photo||'';modal(`<h3>${id?t('edit'):t('add')}</h3><label>${t('name')}<input id="f_n" value="${esc(c.name)}"></label><label>${t('phone')}<input id="f_p" type="tel" value="${esc(c.phone)}"></label><label>${t('note')}<input id="f_t" value="${esc(c.note)}"></label><label>${t('photo')}<input type="file" accept="image/*" onchange="pickPhoto(this)"></label><div id="pv" class="av big" style="margin-top:8px;${tmpPhoto?`background-image:url(${tmpPhoto})`:''}"></div>${Object.keys(M).map(g=>`<h4>${t(g)} (${t(unit()=='cm'?'cm':'inch')})</h4><div class="grid">${M[g].map(f=>`<label>${t(f)}<input type="number" step="any" inputmode="decimal" id="m_${g}_${f}" value="${disp((c.m||{})[g]?.[f])}"></label>`).join('')}</div>`).join('')}<p><small style="color:var(--mu)">${t('need')}</small></p><div class="bar"><button class="gb" id="sv" onclick="saveCust(${id||0})">${t('save')}</button><button class="g" onclick="closeM()">${t('cancel')}</button></div>`);$('#modal').oninput=chkSave;chkSave()}
function pickPhoto(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpPhoto=c.toDataURL('image/jpeg',.72);$('#pv').style.backgroundImage=`url(${tmpPhoto})`};im.src=r.result};r.readAsDataURL(f)}
async function saveCust(id){const name=$('#f_n').value.trim();if(!name)return toast(t('nm'));if(!$('#f_p').value.trim()||!['kameez','shalwar','waistcoat'].some(g=>M[g].every(f=>$('#m_'+g+'_'+f).value!=='')))return toast(t('need'));const m={};for(const g in M){m[g]={};M[g].forEach(f=>{const v=$(`#m_${g}_${f}`).value;m[g][f]=v===''?'':+inp(+v).toFixed(3)})}const d={name,phone:$('#f_p').value,note:$('#f_t').value,photo:tmpPhoto,m};if(id)Object.assign(db.c.find(x=>x.id==id),d);else{d.id=Date.now();db.c.push(d);cur=d.id}await save();closeM();view=id?'cd':'cust';if(!id)view='cd';render()}
function delCust(id){ask(t('sure'),async()=>{db.c=db.c.filter(c=>c.id!=id);db.o=db.o.filter(o=>o.cid!=id);await save();go('cust')})}
function ordForm(cid,from){const c0=cid||(view=='cd'?cur:0),src=from?db.o.find(x=>x.id==from):null;if(!db.c.length){toast(t('none'));return custForm()}modal(`<h3>${t('newOrd')}</h3><label>${t('pick')}<select id="o_c" onchange="showC(this.value)">${db.c.map(c=>`<option value="${c.id}" ${c.id==c0?'selected':''}>${esc(c.name)} · ${esc(c.phone)}</option>`).join('')}</select></label><div id="lk"></div><table><tr><th></th><th>${t('qty')}</th><th>${t('price')}</th></tr>${Object.keys(M).map(g=>`<tr><td>${t(g)}</td><td><input type="number" min="0" id="q_${g}" value="${src?((src.items.find(i=>i.k==g)||{}).q||0):0}" oninput="calcT()"></td><td><input type="number" min="0" id="p_${g}" inputmode="numeric" value="${src?((src.items.find(i=>i.k==g)||{}).p||''):((db.s.rates||{})[g]||'')}" oninput="calcT()"></td></tr>`).join('')}</table><h4>${t('button')}</h4><div class="bts">${BT.map(b=>`<div class="bt" id="bt${b.id}" onclick="pickB(${b.id})"><img src="${BIMG[b.id]}"><br>${b.n}<br><small>${b.c}</small><br><b>Rs ${b.p}</b></div>`).join('')}</div><input type="hidden" id="o_b" value=""><p id="bsel" style="color:var(--gl);margin:4px 0;font-weight:700"></p><label>${t('sets')}<input type="number" min="1" id="o_bq" value="1" oninput="calcT()"></label><p><b>${t('total')}: <span id="tt">Rs 0</span></b></p><h4>${t('style')}</h4>${Object.keys(STY).map(g=>`<details style="margin:4px 0"><summary style="color:var(--gl);cursor:pointer">${t(g)}</summary><div class="grid">${STY[g].map(([k,v])=>`<label>${k}<select id="s_${g}_${k}"><option value="">—</option>${v.map(x=>`<option>${x}</option>`).join('')}</select></label>`).join('')}</div></details>`).join('')}<label>${t('paid')} (Rs)<input type="number" id="o_a" inputmode="numeric" value="0"></label><label>${t('note')}<input id="o_n"></label><div class="bar"><button class="gb" onclick="saveOrd()">${t('save')}</button><button class="g" onclick="closeM()">${t('cancel')}</button></div>`);calcT();showC($('#o_c').value)}
function calcT(){$('#tt').textContent=rs(Object.keys(M).reduce((a,g)=>a+(+$('#q_'+g).value||0)*(+$('#p_'+g).value||0),0)+btP())}
async function saveOrd(){const st={};Object.keys(STY).forEach(g=>STY[g].forEach(([k])=>{const v=$('#s_'+g+'_'+k).value;if(v)(st[g]=st[g]||{})[k]=v}));const items=Object.keys(M).map(g=>({k:g,q:+$('#q_'+g).value||0,p:+$('#p_'+g).value||0})).filter(i=>i.q>0);if(!items.length)return toast(t('qty'));const bi=BT.find(b=>b.id==$('#o_b').value);if(bi&&+$('#o_bq').value>0)items.push({k:'btn',n:t('button')+' · '+bi.n+' ('+bi.c+')',q:+$('#o_bq').value,p:bi.p});const a=+$('#o_a').value||0;const o={id:Date.now(),no:++db.s.n,st,cid:+$('#o_c').value,date:today(),items,total:items.reduce((s,i)=>s+i.q*i.p,0),pay:a>0?[{d:today(),a}]:[],status:'pending',note:$('#o_n').value};db.o.push(o);await save();closeM();cur=o.cid;view='cd';render()}
async function addPay(id){const a=+$('#pa').value;if(!(a>0))return;db.o.find(o=>o.id==id).pay.push({d:today(),a});await save();render()}
async function setStatus(id,s){db.o.find(o=>o.id==id).status=s;await save();render()}
function delOrd(id){ask(t('sure'),async()=>{db.o=db.o.filter(o=>o.id!=id);await save();go('ord')})}

function printHTML(h){$('#pr').innerHTML=h;setTimeout(()=>print(),150)}
function printBill(id){const o=db.o.find(x=>x.id==id),c=db.c.find(x=>x.id==o.cid)||{};printHTML(`<div dir="${lang=='ur'?'rtl':'ltr'}" style="max-width:560px;margin:auto;font-family:inherit"><h2 style="text-align:center;margin:0">♛ ${esc(db.s.shop)}</h2><p style="text-align:center;margin:2px">Karachi</p><hr><p>${t('bill')} #${o.no} · ${o.date}<br><b>${esc(c.name)}</b> ${esc(c.phone)}</p><table>${o.items.map(i=>`<tr><td>${iname(i)}</td><td>${i.q} × ${rs(i.p)}</td><td>${rs(i.q*i.p)}</td></tr>`).join('')}</table>${stHTML(o)}<hr><p><b>${t('total')}: ${rs(o.total)}</b><br>${t('paid')}: ${rs(paid(o))}<br><b>${t('bal')}: ${rs(bal(o))}</b></p><p style="text-align:center">${t('thanks')}</p></div>`)}
function printCard(id){const c=db.c.find(x=>x.id==id);printHTML(`<div dir="${lang=='ur'?'rtl':'ltr'}"><h2>♛ ${esc(db.s.shop)}</h2><h3>${esc(c.name)} · ${esc(c.phone)}</h3>${c.photo?`<img src="${c.photo}" style="height:110px;border-radius:8px">`:''}${Object.keys(M).map(g=>{const m=(c.m||{})[g]||{};return `<h4>${t(g)} (${t(unit()=='cm'?'cm':'inch')})</h4><table><tr>${M[g].map(k=>`<th>${t(k)}</th>`).join('')}</tr><tr>${M[g].map(k=>`<td>${disp(m[k])}</td>`).join('')}</tr></table>`}).join('')}</div>`)}
/* backup */
function dl(n,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
async function backupNow(){const txt=JSON.stringify({v:1,c:db.c,o:db.o,e:db.e,n:db.s.n}),name=`tailor-backup-${today()}.json`;try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});else dl(name,txt)}catch(e){if(e&&e.name=='AbortError')return;dl(name,txt)}db.s.lastBk=today();await save();snap(1);toast(t('ok'));render()}
function applyBackup(d){if(!d||!Array.isArray(d.c)||!Array.isArray(d.o))return toast(t('bad'));ask(t('sure')+' ('+d.c.length+' / '+d.o.length+')',async()=>{db.c=d.c;db.o=d.o;db.e=d.e||[];db.s.n=d.n||d.o.reduce((a,o)=>Math.max(a,o.no||0),0);await save();toast(t('ok'));render()})}
function restoreFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{applyBackup(JSON.parse(r.result))}catch(e){toast(t('bad'))}};r.readAsText(f);el.value=''}
async function loadSnaps(){const e=$('#snaps');if(!e)return;const b=(await kvGet('bk'))||[];e.innerHTML=b.map((x,i)=>`<div class="bar" style="align-items:center"><span style="flex:1">${new Date(x.t).toLocaleString()}</span><button class="g" onclick="restoreSnap(${i})">${t('restore').split(' ')[0]}</button></div>`).join('')||`<small>${t('none')}</small>`}
async function restoreSnap(i){const b=await kvGet('bk');applyBackup(JSON.parse(b[i].d))}
function chPw(){modal(`<h3>${t('chpw')}</h3><label>${t('pw0')}<input id="p0" type="password"></label><label>${t('newpw')}<input id="p1" type="password"></label><label>${t('pass2')}<input id="p2" type="password"></label><div class="bar"><button class="gb" onclick="doCh()">${t('save')}</button><button class="g" onclick="closeM()">${t('cancel')}</button></div>`)}
async function doCh(){if(await hash($('#p0').value,db.s.salt)!=db.s.pw)return toast(t('wrong'));const n=$('#p1').value;if(n.length<4||n!=$('#p2').value)return toast(t('badpw'));db.s.salt=b64(rnd(12));db.s.pw=await hash(n,db.s.salt);await save();closeM();toast(t('ok'))}
const _r=render;render=function(){_r();if(view=='set')loadSnaps()};
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&$('#go'))$('#go').click()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{db=(await kvGet('db'))||{c:[],o:[],s:{lang:'en',unit:'in',shop:'VIP TAILOR',n:0,auto:true}};db.e=db.e||[];db.s.rates=db.s.rates||{};if(db.s.shop=='Tailor VIP')db.s.shop='VIP TAILOR';lang=db.s.lang||'en';lockScreen()})();
